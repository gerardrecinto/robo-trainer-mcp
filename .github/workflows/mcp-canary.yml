name: mcp canary

# Starts the server against the newest mcp release, including the 2.x line this project
# does not support yet. A failure here is a warning to act on, not a merge blocker.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" "mcp[cli]"
      - run: pip list | grep -i "^mcp "
      - run: pytest -q
