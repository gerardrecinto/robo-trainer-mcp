[project]
name = "robo-trainer-mcp"
version = "1.1.0"
description = "MCP server for nutrition, strength, recovery and mood tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gerard Louis Recinto" }]
keywords = ["mcp", "fitness", "strength-training", "nutrition", "recovery", "powerlifting"]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://gerardrecinto.github.io/robo-trainer-mcp/"
Source = "https://github.com/gerardrecinto/robo-trainer-mcp"
Issues = "https://github.com/gerardrecinto/robo-trainer-mcp/issues"

[project.scripts]
robo-trainer-mcp = "robo_trainer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/robo_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["robo_trainer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E701", "E702", "E501"]
