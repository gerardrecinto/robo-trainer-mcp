[project]
name = "robo-trainer-mcp"
version = "1.1.0"
description = "MCP server for nutrition, strength, recovery and mood tracking"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
robo-trainer-mcp = "robo_trainer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_trainer"]
